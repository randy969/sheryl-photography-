<style>
:root{--ground:#0E0C0B;--fg:#F4F0E8;--muted:#BFB7A9;--dim:#8A8276;--hair:#322D26;
  --dusk:#B7AEE0;--c:#F8730C;
  --f:'Cormorant Garamond','Hoefler Text',Georgia,serif;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--fg);font-family:var(--f);
  font-size:19px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  display:flex;flex-direction:column;min-height:100vh}
body::before{content:"";position:fixed;inset:-20% -10% auto;height:120vh;z-index:-1;
  pointer-events:none;opacity:.34;filter:blur(90px);
  background:radial-gradient(60% 50% at 50% 38%,rgba(248,115,12,0.45) 0%,transparent 72%)}
img{display:block;max-width:100%}
a{color:var(--dusk);text-underline-offset:4px}
:focus-visible{outline:3px solid var(--dusk);outline-offset:3px}
.wrap{width:100%;max-width:1200px;margin-inline:auto;
  padding-left:max(20px,env(safe-area-inset-left,0px));
  padding-right:max(20px,env(safe-area-inset-right,0px))}
header{border-bottom:1px solid var(--hair)}
header .wrap{display:flex;align-items:center;gap:14px;padding-block:13px;min-height:62px}
.brand{display:flex;align-items:center;gap:11px;min-height:46px;text-decoration:none;color:var(--fg)}
.brand span{font-size:19px;letter-spacing:.15em;text-transform:uppercase;white-space:nowrap}
.all{margin-left:auto;display:inline-flex;align-items:center;min-height:46px;padding:8px 18px;
  border:2px solid var(--hair);border-radius:999px;text-decoration:none;color:var(--fg);
  font-size:15px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}
main{flex-grow:1}
main .wrap{padding-block:clamp(22px,4vw,46px)}
figure{margin:0}
.shot{display:flex;justify-content:center}
.shot img{max-height:72vh;width:auto;border-radius:3px}
figcaption{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding-top:22px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex-shrink:0;transform:translateY(-2px)}
h1{margin:0;font-size:clamp(30px,6vw,52px);font-weight:300;font-style:italic;line-height:1.1}
.kind{margin-left:auto;font-size:15px;font-weight:600;letter-spacing:.13em;
  text-transform:uppercase;color:var(--dim);white-space:nowrap}
.lede{margin-top:16px;font-size:20px;color:var(--muted);max-width:56ch}
.acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:58px;
  padding:14px 28px;text-decoration:none;background:var(--dusk);color:var(--ground);
  border:2px solid var(--dusk);font-size:16px;font-weight:600;letter-spacing:.09em;
  text-transform:uppercase}
.btn--q{background:none;color:var(--fg);border-color:var(--hair)}
nav.near{display:flex;gap:14px;justify-content:space-between;
  border-top:1px solid var(--hair);margin-top:clamp(30px,5vw,56px);padding-top:22px}
nav.near a{display:flex;flex-direction:column;gap:3px;min-height:56px;text-decoration:none;
  color:var(--fg);max-width:46%}
nav.near b{font-size:21px;font-weight:400;font-style:italic}
nav.near i{font-style:normal;font-size:14px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--dim)}
nav.near .nx{text-align:right;margin-left:auto}
footer{border-top:1px solid var(--hair)}
footer .wrap{padding-block:22px;display:flex;gap:10px 24px;flex-wrap:wrap;
  font-size:16px;color:var(--dim)}
footer .sp{margin-left:auto}
</style>

<header>

          <path d="M32 32 L32 8.5 C25.5 15.5 25.5 24.5 32 32 Z" transform="rotate(300 32 32)"></path>

      </svg>
      <span>Sheryl Ross</span>

    <a class="all" href="../">All 20 photographs</a>
  </div>
</header>

<main>

    <figure>
      <div class="shot">
        <img src="../photos/sunset-ember-full.jpg"
             srcset="../photos/sunset-ember-grid.jpg 1400w, ../photos/sunset-ember-full.jpg 2300w"
             sizes="(max-width: 899px) 94vw, 1100px"
             alt="Ember, a photograph by Sheryl Ross" fetchpriority="high">
      </div>
      <figcaption>
        <span class="dot"></span>
        <h1>Ember</h1>
        <span class="kind">Sunset</span>
      </figcaption>
    </figure>
    <p class="lede">Ember, a sunset photographed by Sheryl Ross.</p>
    <div class="acts">
      <a class="btn" href="../#prints">Available as a print</a>
      <a class="btn btn--q" href="../?about=Ember#contact">Ask Sheryl about this one</a>
    </div>
    <nav class="near" aria-label="Nearby photographs">
      <a href="sunset-sea.html"><i>Previous</i><b>Last Light</b></a>
      <a class="nx" href="sunset-headland.html"><i>Next</i><b>The Point</b></a>
    </nav>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>&copy; 2026 Sheryl Ross</span>
    <span class="sp">All photographs by the artist</span>
  </div>
